name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --quiet
      - name: Start Postgres for the view checks
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
          # The postgres user has to read the migration files. The checkout is private to the runner.
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
